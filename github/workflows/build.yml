name: Build ReactCam Studio APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q ReactCamStudio-CloudBuild-Project-v2.zip -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source/reactcam
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReactCam-Studio-APK
          path: source/reactcam/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
