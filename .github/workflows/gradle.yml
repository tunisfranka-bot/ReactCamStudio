name: Build ReactCam Studio APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -q ReactCamStudio-CloudBuild-Project-v2.zip -d extracted
          test -f extracted/reactcam/settings.gradle.kts
      - name: Fix Java and Kotlin version mismatch
        working-directory: extracted/reactcam
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          marker = "    defaultConfig {\n"
          addition = """    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = "17"
          }

          """

          if 'jvmTarget = "17"' not in s:
              s = s.replace(marker, addition + marker, 1)
              p.write_text(s)

          print("Java and Kotlin targets configured.")
          PY
      - name: Build Android APK
        working-directory: extracted/reactcam
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReactCam-Studio-debug-apk
          path: extracted/reactcam/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
